version: '3.8'

services:
  db:
    image: mongo:latest
    container_name: kamysoft-mongodb
    ports:
      - "27017:27017"
    volumes:
      - kamysoft_mongo_data:/data/db
    restart: unless-stopped

  web:
    build: .
    container_name: kamysoft-erp
    ports:
      - "8089:8089"
    environment:
      - PORT=8089
      - MONGO_URI=mongodb://db:27017/kamysoft-erp
      # Set these in a .env file next to this compose file (never commit it).
      # Generate with: node -e "console.log(require('crypto').randomBytes(48).toString('hex'))"
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env (32+ random characters)}
      - SAAS_ADMIN_KEY=${SAAS_ADMIN_KEY:-}
    depends_on:
      - db
    restart: unless-stopped

volumes:
  kamysoft_mongo_data:
